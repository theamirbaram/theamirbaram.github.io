      For a post image, put a 1200x630 JPG next to index.html, point og:image at it and switch twitter:card to summary_large_image.
   3. Add a <li> to writing/index.html and remove the "first post is on its way" paragraph.
   4. Add an <item> to writing/feed.xml.
   5. Add the page to sitemap.xml (with hreflang pairs if there is a translation).
   6. Optionally add a line to the News band on the home page.
   7. After pushing: check the live URL, request indexing in Search Console, and test the preview in LinkedIn's Post Inspector
      (https://www.linkedin.com/post-inspector/).
-->
